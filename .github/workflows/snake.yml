name: Generate contribution snake
on:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVG snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237DEB6F&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%238BF571
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
